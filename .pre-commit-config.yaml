repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^pnpm-lock\.yaml$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --directory apps/api mypy
        language: system
        pass_filenames: false
        files: ^apps/api/.*\.py$

      - id: prettier
        name: prettier
        entry: node ./node_modules/prettier/bin/prettier.cjs --write
        language: system
        types_or: [javascript, ts, tsx, json, markdown, yaml, css]
